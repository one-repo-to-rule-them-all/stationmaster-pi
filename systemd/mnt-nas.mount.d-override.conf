# Drop-in for the auto-generated mnt-nas.mount (from /etc/fstab).
# Install to: /etc/systemd/system/mnt-nas.mount.d/override.conf
#
# Ensures the NAS hostname in /etc/hosts is resolved (by nas-resolve.service)
# before the CIFS mount is attempted.
[Unit]
After=nas-resolve.service
Wants=nas-resolve.service
